packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  workerd: true

# Versions for packages used by more than one workspace.
catalog:
  "@types/node": 26.6.6
  typescript: 7.0.2
  vitest: 5.1.1
  zod: 4.6.7

minimumReleaseAgeExclude:
  - "@vitest/mocker@5.1.1"
  - "@vitest/spy@5.1.1"
  - vitest@5.1.1
  - ultracite@8.3.0
  - "@turbo/darwin-64@2.11.12"
  - "@turbo/darwin-arm64@2.11.12"
  - "@turbo/linux-64@2.11.12"
  - "@turbo/linux-arm64@2.11.12"
  - "@turbo/windows-64@2.11.12"
  - "@turbo/windows-arm64@2.11.12"
  - turbo@2.11.12
  - "@cloudflare/kv-asset-handler@0.5.1"
  - "@cloudflare/workers-utils@0.55.0"
  - miniflare@5.20261118.0-beta
  - wrangler@4.165.0
